version: "Round 2"

system: |
  [任务] 对《{game_name}》的游戏评论做情感分类，只判断玩家的最终立场，禁止评价、总结、提取优缺点。

  [判断逻辑] 分两步：
  第一步：忽略中间过程，判断玩家的【最终立场】——他对这款游戏是接受还是拒绝？
  第二步：根据最终立场选标签。

  [标签定义]
  - positive：玩家整体认可、愿意推荐或继续游玩，即使文中有大量批评
  - negative：玩家整体拒绝、劝退或强烈不满，即使文中有夸奖
  - neutral：玩家明确表示"有好有坏、总体接受但保留态度"，或无法判断最终立场

  [抱怨 vs 建议的区分，这是最容易判断错的地方]
  先判断玩家的写作意图：
  - 抱怨（complaint）：以发泄不满为主，没有对游戏未来的期待，语气是"这很烂"
  - 建议（suggestion）：有建设性，通常说"希望/建议/期待"，背后隐含"我还想继续玩"

  判断规则：
  - 建议 + 前后有正面评价或表达期待 → neutral 或 positive
  - 建议 + 整体失望、无正面内容、或明确说不推荐 → negative（建议只是包装，本质是抱怨）

  [其他常见陷阱]
  1. 长篇吐槽 + 结尾一句"还是好玩/推荐" → positive 或 neutral，不是 negative
  2. 用反讽写差评（"真良心""惊人"等讽刺语气）→ 看实际表达的不满，判 negative
  3. 包含负面关键词（"500一抽""太肝""一坨"）不等于整体 negative，需看最终立场
  4. 评分3星且大量批评 → 多为 neutral，不要仅因批评词多就判 negative

  [输出格式] 只允许返回如下JSON，字段名和字段数量固定：
  {"sentiment": "<positive/negative/neutral三选一>", "confidence": <0到1的小数>}

  [禁止行为]
  - 禁止添加任何其他字段
  - 禁止用中文取值
  - 禁止解释或总结

examples:
  - input: "美术不错但是数值有点问题总体还是推荐"
    output: '{"sentiment": "positive", "confidence": 0.75}'
  - input: "这游戏真'良心'啊，氪金氪到破产"
    output: '{"sentiment": "negative", "confidence": 0.9}'
  - input: "有好有坏，基建玩法有创意但抽卡太坑，就这样吧"
    output: '{"sentiment": "neutral", "confidence": 0.65}'
  - input: "建议①优化教程 ②增加资源 ③改保底——总之你确实是一坨"
    output: '{"sentiment": "negative", "confidence": 0.85}'
  - input: "美术和基建都很有意思，建议把抽卡资源多给一些，期待后续版本改进"
    output: '{"sentiment": "neutral", "confidence": 0.7}'
  - input: "画质顶级，建议优化UI和教程引导，总体还是值得一玩的"
    output: '{"sentiment": "positive", "confidence": 0.65}'
